name: Linux packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build DEB, RPM and AppImage (Ubuntu 22.04 / glibc 2.35)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Reject Python source and bytecode in the Studio repository
        run: |
          if find . -path './.git' -prune -o -type f \
            \( -name '*.py' -o -name '*.pyw' -o -name '*.pyc' -o -name '*.pyo' \) -print -quit | grep -q .; then
            echo "Python source or bytecode remains in the DFT Agent Studio repository."
            find . -path './.git' -prune -o -type f \
              \( -name '*.py' -o -name '*.pyw' -o -name '*.pyc' -o -name '*.pyo' \) -print
            exit 1
          fi
          if find . -path './.git' -prune -o -type d -name '__pycache__' -print -quit | grep -q .; then
            echo "Python bytecode cache directories remain in the DFT Agent Studio repository."
            find . -path './.git' -prune -o -type d -name '__pycache__' -print
            exit 1
          fi

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.5.3"
          host: linux
          target: desktop
          arch: gcc_64
          modules: qtshadertools
          cache: true

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build rpm cpio patchelf libsqlite3-dev zlib1g-dev libyaml-cpp-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libfuse2 file squashfs-tools imagemagick

      - name: Verify target libc
        run: |
          ldd --version | head -n 1 | grep -F "2.35"

      - name: Build standalone llama.cpp runtime and training executable
        run: |
          git clone --depth 1 --branch b9999 https://github.com/ggml-org/llama.cpp.git third_party/llama.cpp
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "47c786924ad1ab7e91da2cdc72fcdb563780c2bd"
          cmake -S third_party/llama.cpp -B build/llama.cpp -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/llama-install" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_CUDA=OFF \
            -DGGML_VULKAN=OFF \
            -DGGML_SYCL=OFF \
            -DGGML_BLAS=OFF \
            -DLLAMA_OPENSSL=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF
          cmake --build build/llama.cpp --target llama-server llama-finetune --parallel 2
          test -x build/llama.cpp/bin/llama-server
          test -x build/llama.cpp/bin/llama-finetune
          build/llama.cpp/bin/llama-server --version
          build/llama.cpp/bin/llama-finetune --version

      - name: Configure Studio
        run: |
          if ! cmake -S . -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DQT_DEPLOY_USE_PATCHELF=ON \
            -DDFT_LLAMA_SERVER_BINARY="$GITHUB_WORKSPACE/build/llama.cpp/bin/llama-server" \
            -DDFT_LLAMA_FINETUNE_BINARY="$GITHUB_WORKSPACE/build/llama.cpp/bin/llama-finetune" \
            > /tmp/studio-cmake-configure.log 2>&1; then
            cat /tmp/studio-cmake-configure.log
            detail=$(tail -n 12 /tmp/studio-cmake-configure.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Studio CMake configure failed::$detail"
            exit 1
          fi
          cat /tmp/studio-cmake-configure.log

      - name: Build Studio
        run: |
          if ! cmake --build build/package --parallel 2 > /tmp/studio-cmake-build.log 2>&1; then
            tail -n 50 /tmp/studio-cmake-build.log
            detail=$(tail -n 12 /tmp/studio-cmake-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')
            echo "::error title=Studio C++ build failed::$detail"
            exit 1
          fi
          cat /tmp/studio-cmake-build.log

      - name: Run package checks
        run: |
          ctest --test-dir build/package --output-on-failure

      - name: Create packages
        run: |
          mkdir -p dist
          cd build/package
          cpack -G DEB -B "$GITHUB_WORKSPACE/dist"
          cpack -G RPM -B "$GITHUB_WORKSPACE/dist"
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find "$GITHUB_WORKSPACE/dist" -maxdepth 1 -name '*.rpm' -print -quit)"

      - name: Smoke test DEB and RPM without Python or host Qt
        run: |
          deb=$(find dist -maxdepth 1 -name '*.deb' -print -quit)
          rpm=$(find dist -maxdepth 1 -name '*.rpm' -print -quit)
          mkdir -p package-smoke/deb package-smoke/rpm
          dpkg-deb -x "$deb" package-smoke/deb
          (cd package-smoke/rpm && rpm2cpio "$GITHUB_WORKSPACE/$rpm" | cpio -idm --quiet)
          for root in package-smoke/deb package-smoke/rpm; do
            test -x "$root/usr/bin/dft-agent-studio"
            test -x "$root/usr/bin/dft-model-finetune"
            test -x "$root/usr/bin/dft-training-data"
            test -x "$root/usr/bin/dft-training-shards"
            test -x "$root/usr/bin/dft-training-preflight"
            test -x "$root/usr/bin/dft-evaluation-data"
            test -x "$root/usr/bin/dft-preference-data"
            test -x "$root/usr/bin/dft-agent-feedback"
            test -x "$root/usr/bin/dft-dataset-quality"
            test -x "$root/usr/bin/dft-scroll-trace-analyzer"
            test -x "$root/usr/bin/dft-session-audit"
            "$root/usr/bin/dft-session-audit" --version
            test -x "$root/usr/libexec/dft-agent-studio/llama-server"
            "$root/usr/libexec/dft-agent-studio/llama-server" --version
            "$root/usr/bin/dft-model-finetune" --version
            "$root/usr/bin/dft-training-preflight" --version
            test -n "$(find "$root" -name 'libQt6Core.so.6' -print -quit)"
            test -n "$(find "$root" -type f -name libqxcb.so -print -quit)"
            ! find "$root" \( -type f -o -type l \) \( -name 'python' -o -name 'python3' -o -name 'python3.*' \) -print -quit | grep -q .
            ! strings "$root/usr/bin/dft-agent-studio" | grep -E 'gui_agent_worker|DFT_AGENT_PYTHON|python3'
          done
          docker run --rm \
            -v "$GITHUB_WORKSPACE/package-smoke:/packages:ro" \
            ubuntu:22.04 bash -euxc '
              apt-get update
              apt-get install -y xvfb xauth libgl1 libegl1 libyaml-cpp0.7 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-xfixes0 libxcb-sync1 libxcb-xinput0
              ! command -v python3
              for variant in deb rpm; do
                "/packages/$variant/usr/bin/dft-training-data" --version
                "/packages/$variant/usr/bin/dft-training-shards" --version
                "/packages/$variant/usr/bin/dft-evaluation-data" --version
                "/packages/$variant/usr/bin/dft-preference-data" --version
                "/packages/$variant/usr/bin/dft-agent-feedback" --version
                "/packages/$variant/usr/bin/dft-dataset-quality" --version
                "/packages/$variant/usr/bin/dft-scroll-trace-analyzer" --version
                "/packages/$variant/usr/bin/dft-session-audit" --version
                "/packages/$variant/usr/bin/dft-model-finetune" --version
                status=0
                HOME=/tmp QT_QPA_PLATFORM=xcb timeout 15s xvfb-run -a "/packages/$variant/usr/bin/dft-agent-studio" >"/tmp/$variant-smoke.log" 2>&1 || status=$?
                if [ "$status" -ne 124 ]; then
                  cat "/tmp/$variant-smoke.log"
                  exit 1
                fi
                ! grep -E "Failed to start|Could not load the Qt platform plugin|module .* is not installed|No such file or directory" "/tmp/$variant-smoke.log"
              done
            '

      - name: Create AppImage AppDir
        run: |
          DESTDIR="$GITHUB_WORKSPACE/AppDir" cmake --install build/package --prefix /usr --strip
          install -Dm644 packaging/dft-agent-studio.desktop AppDir/usr/share/applications/dft-agent-studio.desktop
          convert assets/icons/dft-agent-studio.png -resize 512x512 AppDir/dft-agent-studio.png
          install -Dm644 AppDir/dft-agent-studio.png AppDir/usr/share/icons/hicolor/512x512/apps/dft-agent-studio.png
          install -Dm644 packaging/dft-agent-studio.desktop AppDir/dft-agent-studio.desktop
          test -x AppDir/usr/bin/dft-agent-studio
          test -x AppDir/usr/bin/dft-training-data
          test -x AppDir/usr/bin/dft-training-shards
          test -x AppDir/usr/bin/dft-training-preflight
          test -x AppDir/usr/bin/dft-evaluation-data
          test -x AppDir/usr/bin/dft-preference-data
          test -x AppDir/usr/bin/dft-agent-feedback
          test -x AppDir/usr/bin/dft-dataset-quality
          test -x AppDir/usr/bin/dft-scroll-trace-analyzer
          test -x AppDir/usr/bin/dft-session-audit
          AppDir/usr/bin/dft-session-audit --version
          test -x AppDir/usr/bin/dft-model-finetune
          test -x AppDir/usr/libexec/dft-agent-studio/llama-server
          AppDir/usr/libexec/dft-agent-studio/llama-server --version
          AppDir/usr/bin/dft-model-finetune --version
          AppDir/usr/bin/dft-training-preflight --version

      - name: Bundle Qt and create AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          LINUXDEPLOY_OUTPUT_VERSION: 0.1.0
          LINUXDEPLOY_OUTPUT_APP_NAME: dft-agent-studio
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          export QMAKE="$(command -v qmake6 || command -v qmake)"
          test -x "$QMAKE"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --desktop-file AppDir/usr/share/applications/dft-agent-studio.desktop --icon-file AppDir/usr/share/icons/hicolor/512x512/apps/dft-agent-studio.png --plugin qt
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          curl --http1.1 --fail --location --retry 5 --connect-timeout 10 --max-time 120 \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64 \
            --output runtime-x86_64
          appimagetool=squashfs-root/plugins/linuxdeploy-plugin-appimage/appimagetool-prefix/usr/bin/appimagetool
          test -x "$appimagetool"
          ARCH=x86_64 "$appimagetool" --runtime-file "$GITHUB_WORKSPACE/runtime-x86_64" AppDir
          image=$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy*.AppImage' -print -quit)
          test -n "$image"
          install -m755 "$image" dist/dft-agent-studio-0.1.0-x86_64.AppImage

      - name: Smoke test AppImage without Python
        run: |
          image=dist/dft-agent-studio-0.1.0-x86_64.AppImage
          test -x "$image"
          "$image" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/dft-training-data
          test -x squashfs-root/usr/bin/dft-training-shards
          test -x squashfs-root/usr/bin/dft-training-preflight
          test -x squashfs-root/usr/bin/dft-evaluation-data
          test -x squashfs-root/usr/bin/dft-preference-data
          test -x squashfs-root/usr/bin/dft-agent-feedback
          test -x squashfs-root/usr/bin/dft-dataset-quality
          test -x squashfs-root/usr/bin/dft-scroll-trace-analyzer
          test -x squashfs-root/usr/bin/dft-session-audit
          squashfs-root/usr/bin/dft-session-audit --version
          test -x squashfs-root/usr/bin/dft-model-finetune
          test -x squashfs-root/usr/libexec/dft-agent-studio/llama-server
          squashfs-root/usr/libexec/dft-agent-studio/llama-server --version
          squashfs-root/usr/bin/dft-model-finetune --version
          squashfs-root/usr/bin/dft-training-preflight --version
          ! find squashfs-root \( -type f -o -type l \) \( -name 'python' -o -name 'python3' -o -name 'python3.*' \) -print -quit | grep -q .
          ! strings squashfs-root/usr/bin/dft-agent-studio | grep -E 'gui_agent_worker|DFT_AGENT_PYTHON|python3'
          docker run --rm -v "$GITHUB_WORKSPACE/squashfs-root:/app:ro" ubuntu:22.04 bash -euxc '
            apt-get update
            apt-get install -y xvfb xauth libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxcb-randr0 libxcb-render-util0 libxcb-image0 libxcb-util1 libxcb-xfixes0 libxcb-sync1 libxcb-xinput0
            ! command -v python3
            /app/usr/bin/dft-training-data --version
            /app/usr/bin/dft-training-shards --version
            /app/usr/bin/dft-training-preflight --version
            /app/usr/bin/dft-evaluation-data --version
            /app/usr/bin/dft-preference-data --version
            /app/usr/bin/dft-agent-feedback --version
            /app/usr/bin/dft-dataset-quality --version
            /app/usr/bin/dft-scroll-trace-analyzer --version
            /app/usr/bin/dft-session-audit --version
            /app/usr/bin/dft-model-finetune --version
            mkdir -p /tmp/app-home
            set +e
            HOME=/tmp/app-home QT_QPA_PLATFORM=xcb timeout 15s xvfb-run -a /app/AppRun >/tmp/appimage-smoke.log 2>&1
            status=$?
            set -e
            if [ "$status" -ne 124 ]; then
              cat /tmp/appimage-smoke.log
              exit 1
            fi
            ! grep -E "Failed to start|Could not load the Qt platform plugin|module .* is not installed|No such file or directory" /tmp/appimage-smoke.log
          '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-and-appimage-glibc-2.35
          path: dist/*
          if-no-files-found: error
